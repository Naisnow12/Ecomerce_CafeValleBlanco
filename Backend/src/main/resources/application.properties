spring.application.name=backend
server.port=8080

# --- Datasource (valores por defecto; sobreescribir con variables de entorno o application-local.properties) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafeteria}
spring.datasource.username=${DB_USERNAME:angelo}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Hibernate solo valida el esquema; Flyway gestiona las migraciones
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Perfil activo (usar 'local' en desarrollo) ---
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:ValleBlancoCafeteriaSecretKey2026Paraguay@SeguroYLargoParaProduccion!}
app.jwt.expiration-ms=86400000
