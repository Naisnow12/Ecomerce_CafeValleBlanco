name: CD - Entrega Continua

on:
  push:
    branches: [ "main", "new_dev" ]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Pipeline de Despliegue a Producción
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      # -----------------------------------------------------------------
      # Paso 1: Despliegue del Backend en Render (Trigger por Webhook)
      # -----------------------------------------------------------------
      - name: Disparar despliegue en Render (Backend)
        run: |
          echo "=============================================="
          echo "🚀 Iniciando entrega continua para Backend (Render)"
          echo "=============================================="
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Conectando con Render Deploy Hook..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "✅ Despliegue en Render disparado exitosamente (HTTP $HTTP_CODE)."
            else
              echo "⚠️ Render respondió con código HTTP: $HTTP_CODE"
            fi
          else
            echo "ℹ️ Secreto RENDER_DEPLOY_HOOK no configurado en GitHub Secrets."
            echo "   El backend se sincroniza automáticamente mediante Render Git Integration."
          fi

      # -----------------------------------------------------------------
      # Paso 2: Verificación del Despliegue del Frontend (Vercel)
      # -----------------------------------------------------------------
      - name: Verificar despliegue del Frontend (Vercel)
        run: |
          echo "=============================================="
          echo "🌐 Verificando entrega continua para Frontend (Vercel)"
          echo "=============================================="
          echo "Frontend alojado en: https://ecomerce-cafe-valle-blanco.vercel.app"
          echo "Backend alojado en:  https://ecomerce-cafevalleblanco.onrender.com"
          echo "Base de datos en:    Neon PostgreSQL Serverless (AWS us-east-1)"
          echo "✅ Pipeline de Entrega Continua finalizado con éxito."
