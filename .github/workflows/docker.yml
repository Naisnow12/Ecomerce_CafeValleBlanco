name: Docker CI/CD - GHCR & Security Scan

on:
  push:
    branches: [ "main", "new_dev" ]
  pull_request:
    branches: [ "main", "new_dev" ]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ==========================================================
  # 1. Validación de Dockerfiles (Hadolint)
  # ==========================================================
  lint-dockerfiles:
    name: Validar Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Validar Backend/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Backend/Dockerfile
          failure-threshold: error

      - name: Validar Frontend/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Frontend/Dockerfile
          failure-threshold: error

  # ==========================================================
  # 2. Build, Escaneo (Trivy) y Publicación en GHCR
  # ==========================================================
  build-and-publish:
    name: Build, Trivy & Push (${{ matrix.service }})
    needs: lint-dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./Backend
            dockerfile: ./Backend/Dockerfile
          - service: frontend
            context: ./Frontend
            dockerfile: ./Frontend/Dockerfile

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar metadata y tags de imagen (rama, SHA, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/valleblanco-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir imagen local para escaneo de seguridad
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: valleblanco-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: valleblanco-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Publicar imagen en GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
