services:
  db:
    image: postgres:16-alpine
    container_name: valleblanco-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ValleBlanco
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - valleblanco_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ValleBlanco"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: valleblanco-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/ValleBlanco
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-ValleBlancoLocalDevSecretKey2026SeguroParaPruebas!}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: valleblanco-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  valleblanco_pgdata:
