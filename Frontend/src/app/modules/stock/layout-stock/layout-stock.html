<div class="stock-layout">
  <!-- Sidebar -->
  <aside class="stock-sidebar" [class.open]="sidebarOpen()">
    <div class="sidebar-header">
      <a routerLink="/inventario/dashboard" class="sidebar-brand">
        <span class="brand-title">Valle Blanco</span>
        <span class="brand-subtitle">Panel Inventario</span>
      </a>
      <button type="button" class="close-sidebar-btn" (click)="closeSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li>
          <a routerLink="/inventario/dashboard" routerLinkActive="active" (click)="closeSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            Dashboard
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="btn-store" (click)="volverTienda()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Ir a la tienda
      </button>
    </div>
  </aside>

  <!-- Overlay móvil -->
  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  }

  <!-- Contenedor principal -->
  <div class="stock-main">
    <!-- Topbar -->
    <header class="stock-header">
      <button type="button" class="menu-toggle-btn" (click)="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <div class="header-right">
        <div class="user-info">
          <span class="user-role-badge">Encargado de Stock</span>
          <span class="user-name">{{ currentUser()?.nombres }}</span>
          <button type="button" class="btn-logout" (click)="logout()">Salir</button>
        </div>
      </div>
    </header>

    <!-- Área de contenido -->
    <main class="stock-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
