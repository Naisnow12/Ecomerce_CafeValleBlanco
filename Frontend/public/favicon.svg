<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Degradado de fondo verde bosque profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3828"/>
      <stop offset="100%" stop-color="#0E2116"/>
    </linearGradient>
    
    <!-- Degradado dorado para el grano -->
    <linearGradient id="beanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D184"/>
      <stop offset="50%" stop-color="#C89658"/>
      <stop offset="100%" stop-color="#966832"/>
    </linearGradient>
    
    <!-- Degradado para la hoja / montaña -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E8752"/>
      <stop offset="100%" stop-color="#7BB680"/>
    </linearGradient>
  </defs>

  <!-- Contenedor con esquinas redondeadas modernas -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Borde sutil dorado -->
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#C89658" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Taza de café estilizada con plato y aroma -->
  <g transform="translate(18, 20)">
    <!-- Vapor / Aroma artesanal -->
    <path d="M36,18 C33,11 39,5 36,0" fill="none" stroke="#F2D184" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M47,20 C44,11 51,5 48,0" fill="none" stroke="#F2D184" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M58,18 C55,11 61,5 58,0" fill="none" stroke="#F2D184" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Taza -->
    <path d="M18,28 L76,28 C76,28 75,66 47,66 C19,66 18,28 18,28 Z" fill="url(#beanGold)"/>
    
    <!-- Asa de la taza -->
    <path d="M72,34 C82,34 86,41 86,49 C86,57 79,61 68,61" fill="none" stroke="#C89658" stroke-width="5" stroke-linecap="round"/>

    <!-- Grano de café en el centro de la taza -->
    <g transform="translate(47, 47) scale(0.68) translate(-47, -47)">
      <!-- Mitad izquierda del grano -->
      <path d="M47,33 C39,33 34,40 34,49 C34,57 39,63 47,63 C46,55 46,41 47,33 Z" fill="#1B3828"/>
      <!-- Mitad derecha del grano -->
      <path d="M47,33 C55,33 60,40 60,49 C60,57 55,63 47,63 C48,55 48,41 47,33 Z" fill="#244632"/>
      <!-- Hendidura característica del grano (curva S) -->
      <path d="M47,33 Q45,48 49,63" fill="none" stroke="#F2D184" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Plato de la taza -->
    <path d="M10,72 L84,72" stroke="#F2D184" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
