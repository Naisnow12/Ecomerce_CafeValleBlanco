<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Fondo degradado verde oscuro bosque - identidad Valle Blanco -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a28"/>
      <stop offset="100%" stop-color="#0d1f15"/>
    </linearGradient>
    <!-- Grano dorado tostado -->
    <linearGradient id="beanL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d080"/>
      <stop offset="100%" stop-color="#b87a30"/>
    </linearGradient>
    <!-- Sombra interior del grano -->
    <linearGradient id="beanR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c08840"/>
      <stop offset="100%" stop-color="#7a4e1a"/>
    </linearGradient>
    <!-- Vapor suave -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo cuadrado redondeado -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Borde sutil dorado -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none"
        stroke="#c89650" stroke-width="1" opacity="0.35"/>

  <!-- ☕ TAZA artesanal -->
  <!-- Cuerpo de la taza -->
  <path d="M14 30 Q14 46 32 48 Q50 46 50 30 Z" fill="#c89650" opacity="0.95"/>
  <path d="M14 30 L50 30" stroke="#f0d080" stroke-width="1" fill="none"/>

  <!-- Interior de la taza (sombra) -->
  <path d="M16 30 Q16 44 32 46 Q48 44 48 30 Z" fill="#1a3a28" opacity="0.6"/>

  <!-- Superficie del café en la taza -->
  <ellipse cx="32" cy="30" rx="18" ry="4.5" fill="#7a4e1a"/>
  <ellipse cx="32" cy="30" rx="16" ry="3.5" fill="#9a6228"/>

  <!-- Espiral / crema en la superficie del café -->
  <path d="M28,30 Q30,27 32,30 Q34,33 36,30" fill="none"
        stroke="#f0d080" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Asa de la taza -->
  <path d="M50,33 Q58,33 58,39 Q58,45 50,45"
        fill="none" stroke="#c89650" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M50,33 Q56,33 56,39 Q56,43 50,43"
        fill="none" stroke="#1a3a28" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Plato -->
  <ellipse cx="32" cy="49" rx="22" ry="3.5" fill="none"
           stroke="#c89650" stroke-width="2.5"/>

  <!-- GRANOS DE CAFÉ decorativos (arriba de la taza) -->
  <!-- Grano izquierdo -->
  <g transform="translate(20, 17) rotate(-30)">
    <ellipse cx="0" cy="0" rx="4.5" ry="6.5" fill="url(#beanL)"/>
    <path d="M0,-6.5 Q-1,0 1,6.5" fill="none" stroke="#6b3d10" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M0,-6.5 Q1,0 -1,6.5" fill="none" stroke="url(#beanR)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  </g>
  <!-- Grano derecho -->
  <g transform="translate(44, 17) rotate(30)">
    <ellipse cx="0" cy="0" rx="4.5" ry="6.5" fill="url(#beanL)"/>
    <path d="M0,-6.5 Q-1,0 1,6.5" fill="none" stroke="#6b3d10" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- VAPOR / AROMA - 3 espirales doradas -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M25,24 Q23,19 25,15 Q27,11 25,7"
          fill="none" stroke="#f0d080" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M32,22 Q30,17 32,13 Q34,9 32,5"
          fill="none" stroke="#f0d080" stroke-width="2" stroke-linecap="round"/>
    <path d="M39,24 Q37,19 39,15 Q41,11 39,7"
          fill="none" stroke="#f0d080" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Hoja de café sutil - detalle de especialidad -->
  <path d="M10,20 Q14,10 20,15 Q14,16 10,20 Z"
        fill="#4e8752" opacity="0.75"/>
  <path d="M10,20 Q15,13 20,15" fill="none" stroke="#6ab870" stroke-width="0.8" opacity="0.6"/>
</svg>
